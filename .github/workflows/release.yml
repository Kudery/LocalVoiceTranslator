name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v
      - name: Check tag matches package version
        run: |
          version=$(python -c "import localvoicetranslator as m; print(m.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "LocalVoiceTranslator $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
