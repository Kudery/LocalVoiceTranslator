name: release

# Two ways to release:
#  - push a tag "vX.Y.Z" (must match localvoicetranslator.__version__), or
#  - run this workflow manually (Actions -> release -> Run workflow): it tags the
#    selected branch with "v" + __version__ and creates the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          sudo apt-get install -y xvfb
          xvfb-run -a python -m pytest -v
      - name: Determine tag
        run: |
          version=$(python -c "import localvoicetranslator as m; print(m.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version"; exit 1; }
          fi
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $VERSION"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "LocalVoiceTranslator $TAG" --notes-file notes.md
